<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self';">
  <title>Map File Manager</title>
  <link rel="stylesheet" href="./node_modules/leaflet/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
    #map { width: 100vw; height: 100vh; z-index: 1; }
    
    .btn { padding: 6px 10px; cursor: pointer; border: none; border-radius: 4px; font-size: 12px; }
    .btn-primary { background: #007bff; color: white; }
    .btn-danger { background: #ff4d4d; color: white; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-success { background: #28a745; color: white; }
    .btn-sm { padding: 4px 6px; font-size: 11px; cursor: pointer; border: none; border-radius: 3px; color: white; }
    .btn-rename { background: #f39c12; }
    .btn-delete { background: #e74c3c; }

    /* 移動中アナウンスバー */
    #moving-banner {
      display: none;
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      z-index: 2000; background: #e67e22; color: white;
      padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    #moving-banner.active { display: block; }

    /* 上部検索バー */
    #search-box {
      position: absolute; top: 15px; left: 180px; z-index: 1000;
      display: flex; gap: 5px; background: white; padding: 5px; border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    #search-input { border: 1px solid #ccc; border-radius: 4px; padding: 6px 10px; width: 220px; font-size: 13px; outline: none; }

    /* 右パネル */
    #side-panel {
      position: absolute; top: 0; right: -350px; width: 330px; height: 100vh;
      background: white; box-shadow: -2px 0 10px rgba(0,0,0,0.3);
      z-index: 1000; transition: right 0.3s ease; display: flex; flex-direction: column;
    }
    #side-panel.open { right: 0; }
    .panel-header { padding: 15px; background: #f8f9fa; border-bottom: 1px solid #ddd; }
    #subpath-display { font-size: 12px; color: #666; margin-bottom: 10px; word-break: break-all; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    
    #pin-settings-area {
      display: none;
      background: #eef2f5; padding: 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #d0d7de;
    }
    #pin-settings-area.open { display: block; }

    #file-list { 
      flex-grow: 1; overflow-y: auto; padding: 10px; position: relative; transition: background 0.2s;
    }
    #file-list.drag-over { background: #e6f7ff; border: 2px dashed #1890ff; }

    .file-item { display: flex; align-items: center; padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; }
    .file-item:hover { background: #f0f8ff; }
    .file-name { cursor: pointer; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-actions { display: flex; gap: 4px; }

    .color-picker { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
    .color-dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .color-dot.selected { border-color: #333; transform: scale(1.15); }

    /* 左パネル（ピン一覧） */
    #list-toggle-btn { position: absolute; top: 15px; left: 55px; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.3); font-size: 14px; padding: 8px 15px; }
    #left-panel {
      position: absolute; top: 0; left: -340px; width: 320px; height: 100vh;
      background: white; box-shadow: 2px 0 10px rgba(0,0,0,0.3);
      z-index: 1000; transition: left 0.3s ease; display: flex; flex-direction: column;
    }
    #left-panel.open { left: 0; }
    
    .left-panel-controls {
      padding: 10px; background: #f8f9fa; border-bottom: 1px solid #ddd;
      display: flex; flex-direction: column; gap: 8px;
    }
    .left-panel-controls input, .left-panel-controls select {
      padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; outline: none;
    }

    .pin-list-item { padding: 8px 10px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; font-size: 13px; transition: background 0.2s;}
    .pin-list-item:hover { background: #f0f8ff; }
    .pin-list-icon { margin-right: 8px; font-size: 16px; display: flex; align-items: center; }
    .pin-list-text { display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; }
    .pin-list-name { font-weight: bold; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pin-list-coords { font-size: 11px; color: #888; margin-top: 2px;}
    .pin-list-del { margin-left: 5px; opacity: 0.6; padding: 2px 6px; }
    .pin-list-del:hover { opacity: 1.0; }

    /* ダイアログ（入力/インポート確認） */
    #custom-prompt, #import-modal, #export-modal, #conflict-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center;
    }
    .prompt-box {
      background: white; padding: 20px; border-radius: 8px; width: 340px; max-height: 80vh;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 10px;
    }
    .prompt-box input { padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    .prompt-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
  </style>
</head>
<body>
  <div id="moving-banner" data-i18n="movingBanner">📍 位置の変更中：地図をクリックするかピンをドラッグして移動してください</div>

  <button id="list-toggle-btn" class="btn btn-primary" data-i18n="pinListBtn">📋 ピン一覧</button>
  <button id="lang-toggle-btn" class="btn btn-secondary" style="position:absolute; top:15px; right:15px; z-index:1000; box-shadow:0 2px 5px rgba(0,0,0,0.3);" data-i18n="langToggleBtn">🌐 English</button>

  <div id="search-box">
    <input type="text" id="search-input" placeholder="場所・駅名を検索（例: 東京駅）" data-i18n-placeholder="mapSearchPlaceholder">
    <button id="search-btn" class="btn btn-primary" data-i18n="mapSearchBtn">検索</button>
  </div>

  <!-- 左パネル（ピン検索＋並び替え＋インポート/エクスポート） -->
  <div id="left-panel">
    <div class="panel-header" style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0;" data-i18n="leftPanelTitle">📍 登録済みピン</h3>
      <button id="close-left-panel-btn" class="btn" style="background:#ccc;" data-i18n="closeBtn">閉じる</button>
    </div>

    <div class="left-panel-controls">
      <input type="text" id="pin-search-input" placeholder="名前で検索..." data-i18n-placeholder="searchByNamePlaceholder">
      
      <div style="display:flex; align-items:center; gap:5px;">
        <span style="font-size:11px; color:#555;" data-i18n="sortLabel">並び替え:</span>
        <select id="pin-sort-select" style="flex-grow:1;">
          <option value="name_asc" data-i18n="sortNameAsc">50音順 (昇順)</option>
          <option value="name_desc" data-i18n="sortNameDesc">50音順 (降順)</option>

          <option value="created_desc" selected data-i18n="sortCreatedDesc">作成日 (新しい順)</option>
          <option value="created_asc" data-i18n="sortCreatedAsc">作成日 (古い順)</option>
          <option value="updated_desc" data-i18n="sortUpdatedDesc">最終更新 (新しい順)</option>
          <option value="updated_asc" data-i18n="sortUpdatedAsc">最終更新 (古い順)</option>
        </select>
      </div>

      <!-- インポート / エクスポート操作 -->
      <div style="display:flex; justify-content:flex-end; align-items:center; margin-top:2px;">
        <div style="display:flex; gap:5px;">
          <button id="export-btn" class="btn btn-sm btn-success" data-i18n="exportBtn">📤 エクスポート</button>
          <button id="import-btn" class="btn btn-sm btn-primary" data-i18n="importBtn">📥 インポート</button>
        </div>
      </div>
    </div>

    <div id="pin-list-content" style="flex-grow: 1; overflow-y: auto;"></div>
  </div>

  <div id="map"></div>

  <!-- 右パネル -->
  <div id="side-panel">
    <div class="panel-header">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h3 id="panel-title" style="margin:0; word-break: break-all;" data-i18n="panelTitleDefault">📍 選択地点</h3>
        <button id="toggle-settings-btn" class="btn btn-secondary" data-i18n="toggleSettingsBtn">⚙️ ピンの設定</button>
      </div>

      <div id="pin-settings-area">
        <div style="font-weight: bold; font-size: 12px; margin-bottom: 8px; color: #444;" data-i18n="pinSettingsTitle">ピンの管理設定</div>
        <div style="margin-bottom: 8px;">
          <button id="rename-pin-btn" class="btn btn-sm btn-rename" style="width: 100%;" data-i18n="renamePinBtn">✏️ ピンの名前を変更</button>
        </div>
        <div style="font-size: 11px; color: #666; margin-bottom: 4px;" data-i18n="colorLabel">色を変更:</div>
        <div class="color-picker">
          <div class="color-dot" style="background:#2A81CB;" data-color="blue"></div>
          <div class="color-dot" style="background:#2AAD27;" data-color="green"></div>
          <div class="color-dot" style="background:#CB2B2A;" data-color="red"></div>
          <div class="color-dot" style="background:#CACB2B;" data-color="yellow"></div>
          <div class="color-dot" style="background:#9C2BCB;" data-color="violet"></div>
          <div class="color-dot" style="background:#3D3D3D;" data-color="black"></div>
        </div>
        <div style="margin-top: 10px; display: flex; gap: 5px;">
          <button id="move-pin-btn" class="btn btn-sm" style="background: #17a2b8; color: white; flex: 1;" data-i18n="movePinBtn">📍 位置を変更する</button>
          <button id="delete-pin-btn" class="btn btn-sm btn-danger" style="flex: 1;" data-i18n="deletePinBtn">🗑️ ピンを削除</button>
        </div>
      </div>

      <div id="subpath-display">/</div>
      
      <div class="btn-group">
        <button id="btn-up" class="btn" style="background:#ddd; display:none;" data-i18n="btnUp">⬆️ 戻る</button>
        <button id="add-file-btn" class="btn btn-primary" data-i18n="addFileBtn">➕ 追加</button>
        <button id="new-file-btn" class="btn btn-primary" data-i18n="newFileBtn">📄 新規</button>
        <button id="new-dir-btn" class="btn btn-primary" data-i18n="newDirBtn">📁 新規</button>
        <button id="open-explorer-btn" class="btn" style="background:#17a2b8; color:white;" data-i18n="openExplorerBtn">📁 フォルダを開く</button>
      </div>
      <div class="btn-group" style="justify-content: flex-end;">
        <button id="close-panel-btn" class="btn" style="background:#ccc;" data-i18n="closeBtn">閉じる</button>
      </div>
    </div>
    <div id="file-list"></div>
  </div>

  <!-- プロンプトモーダル -->
  <div id="custom-prompt">
    <div class="prompt-box">
      <div id="prompt-message"></div>
      <input type="text" id="prompt-input" autocomplete="off">
      <div class="prompt-buttons">
        <button id="prompt-cancel" class="btn" style="background:#ccc;" data-i18n="cancelBtn">キャンセル</button>
        <button id="prompt-ok" class="btn btn-primary" data-i18n="promptOkBtn">OK</button>
      </div>
    </div>
  </div>

  <!-- エクスポート選択モーダル -->
  <div id="export-modal">
    <div class="prompt-box">
      <h3 style="margin:0 0 10px 0; font-size:16px;" data-i18n="exportModalTitle">📤 エクスポートするピンの選択</h3>
      <input type="text" id="export-search-input" placeholder="名前で検索..." data-i18n-placeholder="searchByNamePlaceholder" style="padding:6px 8px; border:1px solid #ccc; border-radius:4px; font-size:12px; outline:none;">
      <div id="export-pin-list" style="max-height:300px; overflow-y:auto; border:1px solid #ddd; padding:5px; border-radius:4px;"></div>
      <div style="display:flex; justify-content:space-between; margin-top:5px;">
        <button id="export-select-all" class="btn btn-sm btn-secondary" data-i18n="selectAllBtn">全選択</button>
        <button id="export-deselect-all" class="btn btn-sm btn-secondary" data-i18n="deselectAllBtn">全解除</button>
      </div>
      <div class="prompt-buttons">
        <button id="export-cancel-btn" class="btn" style="background:#ccc;" data-i18n="cancelBtn">キャンセル</button>
        <button id="export-confirm-btn" class="btn btn-success" data-i18n="exportConfirmBtn">エクスポート</button>
      </div>
    </div>
  </div>

  <!-- ファイル競合解決モーダル -->
  <div id="conflict-modal">
    <div class="prompt-box" style="width:420px;">
      <h3 style="margin:0 0 5px 0; font-size:16px;" data-i18n="conflictModalTitle">⚠️ 同名ファイルが見つかりました</h3>
      <p style="margin:0 0 10px 0; font-size:12px; color:#666;" data-i18n="conflictModalDesc">
        取り込み先に既に同じ名前のファイルがあります。ファイルごとに操作を選択してください。
      </p>
      <div style="display:flex; gap:5px; margin-bottom:8px;">
        <button id="conflict-all-overwrite" class="btn btn-sm btn-secondary" data-i18n="conflictAllOverwrite">すべて上書き</button>
        <button id="conflict-all-skip" class="btn btn-sm btn-secondary" data-i18n="conflictAllSkip">すべてスキップ</button>
        <button id="conflict-all-rename" class="btn btn-sm btn-secondary" data-i18n="conflictAllRename">すべて別名で保存</button>
      </div>
      <div id="conflict-list" style="max-height:320px; overflow-y:auto; border:1px solid #ddd; padding:5px; border-radius:4px;"></div>
      <div class="prompt-buttons">
        <button id="conflict-cancel-btn" class="btn" style="background:#ccc;" data-i18n="cancelBtn">キャンセル</button>
        <button id="conflict-confirm-btn" class="btn btn-primary" data-i18n="conflictConfirmBtn">この内容で取り込む</button>
      </div>
    </div>
  </div>

  <!-- インポート確認モーダル -->
  <div id="import-modal">
    <div class="prompt-box">
      <h3 style="margin:0 0 10px 0; font-size:16px;" data-i18n="importModalTitle">📥 インポートするピンの選択</h3>
      <div id="import-pin-list" style="max-height:300px; overflow-y:auto; border:1px solid #ddd; padding:5px; border-radius:4px;"></div>
      <div style="display:flex; justify-content:space-between; margin-top:5px;">
        <button id="import-select-all" class="btn btn-sm btn-secondary" data-i18n="selectAllBtn">全選択</button>
        <button id="import-deselect-all" class="btn btn-sm btn-secondary" data-i18n="deselectAllBtn">全解除</button>
      </div>
      <div class="prompt-buttons">
        <button id="import-cancel-btn" class="btn" style="background:#ccc;" data-i18n="cancelBtn">キャンセル</button>
        <button id="import-confirm-btn" class="btn btn-primary" data-i18n="importConfirmBtn">取り込む</button>
      </div>
    </div>
  </div>

  <!-- JSZip & Leaflet（ローカル同梱・オフライン動作） -->
  <script src="./node_modules/jszip/dist/jszip.min.js"></script>
  <script src="./node_modules/leaflet/dist/leaflet.js"></script>
  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
